<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ArchiWeb Contact</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
<main id="container">
    <section id="left-box">
        <p class="eyebrow">Contact</p>
        <h1>Let's Chat</h1>
        <p>Whether you have a question, want to start a project, or simply want to connect, use the form and I'll get back to you.</p>
        <p>Clean communication and fast follow-up help turn ideas into real work.</p>
    </section>
    <section id="right-box">
        <h2>Contact Form</h2>
        <p id="req">*required</p>
        <form>
            <input type="text" placeholder="Name *" required>
            <input type="email" placeholder="Email *" required>
            <input type="text" placeholder="Company">
            <input type="tel" placeholder="Phone">
            <textarea placeholder="Message"></textarea>
            <button type="submit">SUBMIT</button>
        </form>
    </section>
</main>
</body>
</html>
